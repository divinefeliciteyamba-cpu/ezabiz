<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande - EzaBiz</title>

    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Le fichier de gestion de theme clair/sombre -->
    <script src="../assets/js/theme.js" defer></script>

    <!-- Bibliothèque jsPDF : génération de fichiers PDF dans le navigateur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Bibliothèque Socket.io : communication en temps réel avec le serveur -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" crossorigin="anonymous"></script>
    <!-- api.js : fonctions partagées pour parler au backend -->
    <script src="../assets/js/api.js"></script>
</head>
<body>
    <header class="topbar">
        <a href="../index.html" class="topbar-logo">EzaBiz</a>
        <span style="color: white; font-size: 14px;">Suivi de commande</span>
    </header>
    
    <div class="suivi-page">

        <div class="commande-info">
            <h2>Commande</h2>
            <div class="numero-commande" id="numero-commande">#---</div>
            <div class="pme-nom-suivi" id="pme-nom">Chargement...</div>
        </div>

        <p class="section-titre">Progression</p>

        <div class="progression">
            <div class="etape" id="etape-1">
                <div class="cercle">1</div>
                <div class="etape-label">En attente</div>
            </div>
            <div class="etape" id="etape-2">
                <div class="cercle">2</div>
                <div class="etape-label">Confirmée</div>
            </div>
             <div class="etape" id="etape-3">
                <div class="cercle">3</div>
                <div class="etape-label">Livrée</div>
            </div>
        </div>

        <p class="section-titre">Articles commandés</p>
        <div class="articles-suivi">
            <div id="liste-articles"></div>
            <div class="total-suivi">
                <span>Total</span>
                <span id="total-commande">---</span>
            </div>
        </div>

        <button id="btn-facture" class="btn-facture" onclick="genererFacture()">
            📄 Télécharger ma facture
        </button>
    </div>
   
    <script>
         // Récupération de l'ID de commande depuis l'URL

         const parametres = new URLSearchParams(window.location.search);
         const commandeId = parametres.get('id');

         let commandeActuelle = null; // Rempli une fois les données chargées

         if (!commandeId) {
            document.getElementById('pme-nom').textContent = 'Aucune commande spécifiée.';
         }

        function mettreAJourStatut(statut) {
            const etapes = ['En attente', 'Confirmée', 'Livrée'];
            const index = etapes.indexOf(statut);

            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById('etape-' + i);
                el.classList.remove('fait', 'active');

                if (i - 1 < index) el.classList.add('fait');
                if (i - 1 === index) el.classList.add('active');
            }
        }

        function afficherCommande(commande) {
            document.getElementById('numero-commande').textContent = '#' + commande.id;
            document.getElementById('pme-nom').textContent = commande.pme_nom || '';
            document.getElementById('total-commande').textContent = commande.total + ' FC';

            let html = '';
            commande.articles.forEach(function(article) {
                html += `
                    <div class="article-ligne">
                        <span>${article.nom} x${article.quantite}</span>
                        <span>${article.prix_unitaire * article.quantite} FC</span>
                    </div>
                `;
            });
            document.getElementById('liste-articles').innerHTML = html;
            mettreAJourStatut(commande.statut);
        }
        
        // Chargement de la vraie commande depuis l'API
        if (commandeId) {
            fetch('https://ezabiz-production.up.railway.app/api/commandes/' + commandeId, {
                Headers: {
                    'Authorization': 'Bearer' + localStorage.getItem('token')
                }
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(commande) {
                commandeActuelle = commande;
                afficherCommande(commande);
            })
            .catch(function(erreur) {
                console.error('Erreur lors du chargement de la commande:', erreur);
                document.getElementById('pme-nom').textContent = "Impossible de charger la commande.";
            })
        }

        // Connexion au serveur Socket.io - mises à jour en temps réel 
        const socket = io('https://ezabiz-production.up.railway.app');

        // Ecouter les changements de statut
        socket.on('order_status', function(data) {
            console.log('Nouveau statut reçu :', data);

            if (commandeActuelle && data.commande_id === commandeActuelle.id) {
                mettreAJourStatut(data.statut);
            }
        });

        // Gérer les erreurs
        socket.on('connect_error', function(erreur) {
            console.error('Erreur Socket.io :', erreur);
        });

        // Génération de la facture PDF
        function genererFacture() {
            if (!commandeActuelle) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text('Ezabiz - Facture', 14, 20);
            doc.text('Commande #' + commandeActuelle.id, 14, 30);
            doc.text(commandeActuelle.pme_nom || '', 14, 38);

            let y = 50;
            commandeActuelle.articles.forEach(function(article) {
                doc.text(
                    article.nom + ' x' + article.quantite + ' - ' + (articles.prix_unitaire * article.quantite) + ' FC',
                    14, y
                );
                y += 8;
            });

            doc.text('Total : ' + commandeActuelle.total + ' FC', 14, y + 10);
            doc.save('facture-ezabiz-' + commandeActuelle.id + '.pdf');
        }
    </script>
</body>
</html>
