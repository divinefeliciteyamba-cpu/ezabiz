<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzaBiz - Connexion</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Le fichier de gestion de theme clair/sombre -->
    <script src="../assets/js/theme.js" defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">Eza<span>Biz</span></div>
            <div class="auth-subtitle">Connectez-vous pour passer commande </div>

            <label class="auth-label" for="email">Adresse email</label>
            <input class="auth-input" type="email" id="email" placeholder="exemple@gmail.com">

            <label class="auth-label" for="mot_de_passe">Mot de passe</label>
            <input class="auth-input" type="password" id="mot_de_passe" placeholder="........">

            <button class="auth-btn" id="btn-connexion">Se connecter</button>

            <div class="auth-message" id="message"></div>

            <div class="auth-link">
                Pas encore de compte ? <a href="register.html">S'inscrire</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('btn-connexion').addEventListener('click', function() {
            const email = document.getElementById('email').value.trim();
            const mot_de_passe = document.getElementById('mot_de_passe').value;
            const message = document.getElementById('message');
           
            // Validation simple
            if (!email || !mot_de_passe) {
                message.className = 'auth-message erreur';
                message.textContent = 'Veuillez remplir tous les champs.';
                return;
            }

            message.className = 'auth-message';
            message.textContent = 'Connexion en cours...';

            fetch('https://ezabiz-production.up.railway.app/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json'},
                body: JSON.stringify({ email, mot_de_passe })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(resultat) {
                if (resultat.token) {
                    // Connexion réussie
                    localStorage.setItem('token', resultat.token);

                    // Décoder le rôle depuis le token
                    const payload = JSON.parse(atob(resultat.token.split('.') [1]));
                    const role = payload.role;

                    localStorage.setItem('role', role);

                    if (role === 'pme') {
                        window.location.href = '../dashboard/login.html';
                    } else {
                        const retour = localStorage.getItem('retour_apres_login');
                        if (retour) {
                            localStorage.removeItem('retour_apres_login');
                             window.location.href = retour;
                        } else {
                             window.location.href = '../index.html';
                        }
                    }
                } else {
                  message.className = 'auth-message erreur';
                  message.textContent = resultat.erreur || 'Email ou mot de passe incorrect.';
                }
            })   
            .catch(function(erreur) {
                 message.className = 'auth-message erreur';
                 message.textContent = 'Erreur de connexion. Réessayez.';
                 console.error(erreur);
            });
        });
    </script>
</body>
</html>
