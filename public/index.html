<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user=scalable=no">
    <title>EzaBiz</title>
    <!-- Le fichier CSS de feuille   -->
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- La librairie Font-Awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Le fichier CSS du projet -->
     <link rel="stylesheet" href="assets/css/style.css">
     <!-- Le fichier JavaScript de feuillet   -->
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
      <script src="assets/js/fake-data.js"></script>
     <style>
        *{
            margin: 0;
            padding: 0;
        }
        #carte {
            height: 100vh;
            width: 100%;
        }
        body {
            padding: 0;
            margin: 0;
        }

        html, body, #carte {
            height: 100%;
            width: 100vw;
        }
     </style>
</head>
<body>
    <div id="filtres">
        <button class="btn-filtre" data-cat="tous">Tous</button>
        <button class="btn-filtre" data-cat="restauration">Restauration</button>
        <button class="btn-filtre" data-cat="pharmacie">Pharmacie</button>
        <button class="btn-filtre" data-cat="epicerie">Épicerie</button>
        <button class="btn-filtre" data-cat="electronique">Électronique</button>
    </div>
    <div id="carte"></div>
    <script>
      const carte = L.map('carte').setView([-11.632240, 27.460640], 13);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(carte);
      
      //Création des icônes pour les catégories
      
      function getIcone(categorie, nom){
            const icones = {
                'Restauration' : '<i class="fa-solid fa-bowl-food"></i>',
                'Pharmacie': '<i class="fa-solid fa-pills"></i>',
                'Epicerie' :'<i class="fa-solid fa-basket-shopping"></i>',
                'Eleectronique':'<i class="fa-solid fa-mobile"></i>'
            };
            const icone = icones[categorie] || '<i class="fa-solid fa-store"></i>';
            return L.divIcon({
            className: '',
            html : '<div class="marqueur-' + categorie.toLowerCase()+ '">' + icone + ' ' + nom + '</div>',
            iconSize : [130, 30]
           });
        };
      //Création des marqueurs
      let tousLesMarqueurs = [];

      FAKE_PMES.forEach(function(pme){
         const marqueur = L.marker([pme.lat, pme.lng], {icon: getIcone(pme.categorie, pme.nom)})
              .bindPopup(
              '<b>'+ pme.nom+ '</b><br>'+ pme.categorie + 
              '<br><a href="pme/fiche.html?id='+ pme.id +'" class="btn-fiche">Voir la fiche</a>'
              )
              .addTo(carte);
         tousLesMarqueurs.push(marqueur);
      });

      //Filtrage des marqueurs 
      function filtrerMarqueurs(categorie){ 
      // Enlever les marqueurs 
      tousLesMarqueurs.forEach(function(marqueur){
          carte.removeLayer(marqueur);
      });
       //Restituer les marqueurs dans "Tous"
      if(categorie === "tous"){
        tousLesMarqueurs.forEach(function(marqueur){
            marqueur.addTo(carte);
        });
        return;
      };
      // Garder les pmes de la catégorie concernée
      const pmesFiltrees = FAKE_PMES.filter(function(pme){
        return pme.categorie.toLowerCase() === categorie;
      });
      // Remettre les marqueurs filtrés
      pmesFiltrees.forEach(function(pme){
        const marqueur = L.marker([pme.lat, pme.lng], {icon: getIcone(pme.categorie, pme.nom)})
            .bindPopup(
                '<b>'+ pme.nom+ '</b><br>'+ pme.categorie  + 
                '<br?<a href="pme/fiche.html?id='+ pme.id +'" class="btn-fiche">Voir la fiche</a>'
            )
            .addTo(carte);
        tousLesMarqueurs.push(marqueur);
      });
      }
      // Actionner le filtrage par le click
      document.querySelectorAll('.btn-filtre').forEach(function(bouton){
         bouton.addEventListener('click', function(){
         const categorie = bouton.dataset.cat;
         filtrerMarqueurs(categorie)
      });
      });
       
    </script>
</body>
</html>
