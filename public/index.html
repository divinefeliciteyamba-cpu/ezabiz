<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user=scalable=no">
    <title>EzaBiz</title>
    <!-- Le fichier CSS de feuille   -->
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- La librairie Font-Awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Le fichier CSS du projet -->
     <link rel="stylesheet" href="assets/css/main.css">
    <!-- Le fichier de gestion de theme clair/sombre -->
     <script src="assets/js/theme.js" defer></script>
     <!-- Le fichier JavaScript de feuillet   -->
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
      <!-- Lien Leafleat.markercluster-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"> 
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
      <!-- Lien Leaflet Routing Machine-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-routing-machine/3.2.12/leaflet-routing-machine.js"></script>
     <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {  height: 100%; width: 100vw; }
        #carte {
            height: calc(100vh - 56px - 48px);
            width: 100%;
            filter: brightness(0.85) contrast(0.9) saturate(0.9);
        }
        /* Panneau itinéraire */
        .leaflet-routing-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            max-width: 280px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        .leaflet-routing-alt {
            max-height: 200px;
            overflow-y: auto;
        }
        #btn-effacer-route {
            display: none;
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 10px 20px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            font-family: Arial, sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(185, 28, 28, 0.3);
        }
     </style>
</head>
<body>
    <!-- Topbar -->
     <header class="topbar">
         <span class="topbar-logo">EzaBiz</span>
         <a class="compteur-panier" href="commandes/panier.html">
            🛒 <span id="cart-count">0</span>
         </a>
     </header>
    
    <!-- Filtres -->
    <div id="filtres">
        <button class="btn-filtre" data-cat="tous">Tous</button>
        <button class="btn-filtre" data-cat="restauration">Restauration</button>
        <button class="btn-filtre" data-cat="couture">Couture</button>
        <button class="btn-filtre" data-cat="coiffure">Coiffure</button>
        <button class="btn-filtre" data-cat="quincaillerie">Quincaillerie</button>
        <button class="btn-filtre" data-cat="transport">Transport</button>
    </div>

    <!-- Carte -->
    <div id="carte"></div>
    
    <!-- Bouton pour effacer l'itinéraire-->
     <button id="btn-effacer-route" onclick="effacerItineraire()">
        x Effacer l'itinéraire
     </button>

    <script>
        const carte = L.map('carte').setView([-11.632240, 27.460640], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {maxZoom: 19, attribution: '© CartoDB'}).addTo(carte);
      
        //Création des icônes pour les catégories
        const ICONES_CAT = {
            'restauration' : {fa : 'fa-utensils', classe: 'marqueur-restauration'},
            'couture': {fa : 'fa-scissors', classe: 'marqueur-couture'},
            'coiffure' :{fa : 'fa-cut', classe: 'marqueur-coiffure'},
            'quincaillerie':{fa : 'fa-hammer', classe: 'marqueur-quincaillerie'},
            'transport':{fa : 'fa-bus', classe: 'marqueur-transport'},
        };

        function getIcone(categorie, nom) {
            const config = ICONES_CAT[categorie] || {fa : 'fa-store', classe: 'marqueur-autre'};
            const html =
                '<div class="marqueur ' + config.classe + '">' +
                    '<div class="marqueur-icone">' + 
                        '<i class="fa-solid ' + config.fa + '"></i>' +
                    '</div>' +
                    '<span class="marqueur-nom">' + nom + '</span>' +
                '</div>';
            return L.divIcon({
                className: '',
                html: html,
                iconSize: [160, 32],
                iconAnchor: [16, 16], // ancré sur le rond, pas le texte
                popupAnchor: [80, -16]
            });
        }

        // Création des Marqueurs et clusters
        let clustersGroup = L.markerClusterGroup();
        let tousLesMarqueurs = [];
        let marqueurUtilisateur = null;
        let positionUtilisateur = null;
        let routeControl = null;

        // Géolocalisation
        function afficherPosition(position) {
            positionUtilisateur = position.coords;
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;

            if (marqueurUtilisateur) {
                carte.removeLayer(marqueurUtilisateur);
            }

            marqueurUtilisateur = L.circleMarker([lat, lng], {
               radius: 10,
               fillColor: '#0f766e',
               color: 'white',
               weight: 2,
               opacity: 1,
               fillOpacity: 1
            }).addTo(carte).bindPopup('📍 Vous êtes ici');

            carte.setView([lat, lng], 14);
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(afficherPosition, function() {
                console.log('Géolocalisation refusée ou indisponible.');
            });
        }

        // Itinéraire Leaflet Routing Machine
        function afficherItineraire(latPME, lngPME, nomPME) {
            if (!positionUtilisateur) {
                alert('Activez la géolocalisation pour obtenir un itinéraire.');
                return;
            }

            // Effacer l'ancien itinéraire
            if (routeControl) {
                carte.removeControl(routeControl);
            }

            routeControl = L.Routing.control({
                waypoints: [
                    L.latLng(positionUtilisateur.latitude, positionUtilisateur.longitude),
                    L.latLng(latPME, lngPME)
                ],
                language: 'fr',
                show: true,
                routeWhileDragging: false,
                lineOptions: {
                    styles: [{ color: '#0f766', weight: 5, opacity: 0.8 }]
                },
                createMarker: function() { return null;} // on garde nos propres marqueurs
            }).addTo(carte);

            // Afficher le bouton effacer
            document.getElementById('btn-effacer-route').style.display = 'block';

            //Fermer le popup
            carte.closePopup();
        }

        function effacerItineraire() {
            if (routeControl) {
                carte.removeControl(routeControl);
                routeControl = null;
            }
            document.getElementById('btn-effacer-route').style.display = 'none';
        }

        // Ecoute tous les clics sur les boutons Itinéraire, même ceux créés dans les popus
        document.addEventListener('click', function(e) {
            if(e.target.classList.contains('btn-itineraire')) {
                const lat = parseFloat(e.target.dataset.lat);
                const lng = parseFloat(e.target.dataset.lng);
                const nom = e.target.dataset.nom;
                afficherItineraire(lat, lng, nom);
            }
        });

        // Chargement des PME depuis l'API
        fetch('https://ezabiz-production.up.railway.app/api/pme') //Envoie une demande au serveur
            .then(function(response){
                return response.json();
            })
            .then(function(pmes) {
                pmes.forEach(function(pme) {
                    const marqueur = L.marker(
                        [pme.latitude, pme.longitude],
                        { icon: getIcone(pme.categorie, pme.nom) }
                    ).bindPopup(
                        '<b>' + pme.nom + '</b>' + 
                        '<br><small style="color:#5261f">' + pme.categorie + '</small>' +
                        '<br><a href="pme/fiche.html?id=' + pme.id +'" class="btn-fiche" style="display:block; margin-top:6px; width:100%; box-sizing:border-box; text-align:center; color:white; text-decoration:none; font-weight:700;">Voir la fiche</a>' +
                        '<br><button class="btn-fiche btn-itineraire" style="margin-top:6px; background:#0369A1; border:none; cursor:pointer; width:100%;" '+ 
                        'data-lat="' + pme.latitude + '" data-lng="' + pme.longitude + '" data-nom="' + pme.nom.replace(/"/g, '&quot;') + '"> 🧭 Itinéraire</button>'
                    );

                    marqueur.categorie = pme.categorie;
                    tousLesMarqueurs.push(marqueur);
                    clustersGroup.addLayer(marqueur);
                });
                          
                carte.addLayer(clustersGroup);
            })
            .catch(function(erreur) {
                console.error('Erreur de chargement des PME:', erreur)
            });

        //Filtrage des marqueurs 
        function filtrerMarqueurs(categorie) { 
            // Enlever les marqueurs actuellement affichés
            tousLesMarqueurs.forEach(function(marqueur){
                carte.removeLayer(marqueur);
                clustersGroup.removeLayer(marqueur);
            });
            //Restituer les marqueurs dans "Tous"
            if(categorie === "tous"){
               tousLesMarqueurs.forEach(function(marqueur){
                   clustersGroup.addLayer(marqueur);
               });
               carte.addLayer(clustersGroup);
               return;
            }

            const marqueursFiltres = tousLesMarqueurs.filter(function(marqueur) {
                return marqueur.categorie.toLowerCase() === categorie;
            });
    
            marqueursFiltres.forEach(function(marqueur) {
                clustersGroup.addLayer(marqueur);
            });
            carte.addLayer(clustersGroup);
        }

        // Boutons filtres
        document.querySelectorAll('.btn-filtre').forEach(function(bouton) {
            bouton.addEventListener('click', function() {
                document.querySelectorAll('.btn-filtre').forEach(function(b) {
                    b.classList.remove('actif');
                });
                bouton.classList.add('actif');
                filtrerMarqueurs(bouton.dataset.cat);
            });
        });

        //Compteur pqnier
        function updateCartCount() {
            const panier = JSON.parse(localStorage.getItem('panier')) || [];
            document.getElementById('cart-count').textContent = panier.length;
        }
        updateCartCount();
        window.addEventListener('storage', updateCartCount);


    </script>
</body>
</html>
