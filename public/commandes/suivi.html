<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande - EzaBiz</title>
    <!-- Bibliothèque jsPDF : génération de fichiers PDF dans le navigateur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Bibliothèque Socket.io : communication en temps réel avec le serveur -->
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: #e4e4f0;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(145deg, #1a1d2e, #15172a);
            border-bottom: 1px solid #2d2f45;
        }

        .logo { color: #a78bfa; font-weight: bold; font-size: 18px;}

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .commande-info {
            background: linear-gradient(145deg, #1a1d2e, #15172a);
            border: 1px solid #2d2f45;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 32px;
        }

        .commande-info h2 {
           font-size: 13px;
           color: #9595b3;
           margin-bottom: 4px;
           text-transform: uppercase;
           letter-spacing: 0.5px;
        }

        .numero {
            font-size: 24px;
            font-weight: bold;
            color: #a78bfa;
        }

        .pme-nom {
            font-size: 14px;
            color: #9595b3;
            margin-top: 4px;
        }

        /* Progression horizontale */
        .progression {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            margin-bottom: 36px;
            position: relative;
        }

        .etape {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
        }
        
        /* Ligne entre les cercles */
        .etape:not(:last-child)::after { 
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: #2d2f45;
            z-index: 0;
        }
        
        .etape.fait:not(:last-child)::after {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }
        .cercle {
           width: 40px;
           height: 40px;
           border-radius: 50%;
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 16px;
           font-weight: bold;
           border: 2px solid #2d2f45;
           background: #1a1d2e;
           color: #9595b3;
           z-index: 1;
           position: relative;
        }

        .etape.fait .cercle {
            background: #14532d;
            border-color: #16a34a;
            color: #4ade80;
        }

        .etape.active .cercle {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: #6366f1;
            color: white;
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.6);
        }

        .etape-label {
            margin-top: 10px;
            font-size: 12px;
            color: #9595b3;
            text-align: center;
            font-weight: 600;
        }

        .etape.active .etape-label{ color: #a78bfa; }
        .etape.fait .etape-label{ color: #4ade80; }
         
        /* Articles */
        .section-titre {
            font-size: 12px;
            color: #9595b3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .articles {
            background: linear-gradient(145deg, #1a1d2e, #15172a);
            border: 1px solid #2d2f45;
            border-radius: 14px;
            padding: 18px;
        }

        .article-ligne {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2d2f45;
            font-size: 14px;
            color: #e4e4f0;
        }

        .article-ligne:last-child { border-bottom: none; }

        .total-suivi {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
            font-weight: bold;
            color: #a78bfa;
            font-size: 15px;
            padding-top: 12px;
            border-top: 1px solid #2d2f45;
        }
        #btn-facture {
            width: 100%;
            margin-top: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <span class="logo">EzaBiz</span>
        <span style="color: #9595b3; font-size: 13px;">Suivi de commande</span>
    </header>

    <main>
        <div class="commande-info">
            <h2>Commande</h2>
            <div class="numero" id="numero-commande">#---</div>
            <div class="pme-nom" id="pme-nom">---</div>
        </div>

        <p class="section-titre">Progression</p>

        <div class="progression">
            <div class="etape" id="etape-1">
                <div class="cercle">1</div>
                <div class="etape-label">En attente</div>
            </div>
            <div class="etape" id="etape-2">
                <div class="cercle">2</div>
                <div class="etape-label">Confirmée</div>
            </div>
             <div class="etape" id="etape-3">
                <div class="cercle">3</div>
                <div class="etape-label">Livrée</div>
            </div>
        </div>

        <p class="section-titre">Articles commandés</p>
        <div class="articles">
            <div id="liste-articles"></div>
            <div class="total-suivi">
                <span>Total</span>
                <span id="total-commande">---</span>
            </div>
        </div>

        <button id="btn-facture" onclick="genererFacture()">
            📄 Télécharger ma facture
        </button>
    </main>

    <script>
        // Données fictives temporaires 
        const commande = {
            id: 1,
            numero: '001',
            pme_nom: 'Restaurant Mama Cécile',
            statut: 'Confirmée',
            total: 25000,
            articles: [
                { nom: 'Poulet rôti', prix: 15000, quantite: 1},
                { nom: 'Jus de bissap', prix: 5000, quantite: 2}
            ]
        };

        function mettreAJourStatut(statut) {
            const etapes = ['En attente', 'Confirmée', 'Livrée'];
            const index = etapes.indexOf(statut);

            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById('etape-' + i);
                el.classList.remove('fait', 'active');

                if (i - 1 < index) el.classList.add('fait');
                if (i - 1 === index) el.classList.add('active');
            }
        }

        function afficherCommande(commande) {
            document.getElementById('numero-commande').textContent = '#' + commande.numero;
            document.getElementById('pme-nom').textContent = commande.pme_nom;
            document.getElementById('total-commande').textContent = commande.total + ' FC';

            let html = '';
            commande.articles.forEach(function(article) {
                html += `
                    <div class="article-ligne">
                        <span>${article.nom} x${article.quantite}</span>
                        <span>${article.prix * article.quantite} FC</span>
                    </div>
                `;
            });
            document.getElementById('liste-articles').innerHTML = html;
            mettreAJourStatut(commande.statut);
        }

        afficherCommande(commande);

        // Connexion au serveur Socket.io
        const socket = io('https://ezabiz-production.up.railway.app');

        // Ecouter les changements de statut
        socket.on('order_status', function(data) {
            console.log('Nouveau statut reçu :', data);

            // Vérifier que c'est bien notre commande
            if(data.commande_id === commande.id) {
                mettreAJourStatut(data.statut);
            }
        });

        // Confirmer la connexion
        socket.on('connect', function() {
            console.log('Connecté au serveur en temps réel !');
        });

        // Gérer les erreurs
        socket.on('connect_error', function(erreur) {
            console.error('Erreur Socket.io :', erreur);
        });
    </script>
</body>
</html>
