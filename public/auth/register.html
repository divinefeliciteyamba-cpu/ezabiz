<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EzaBiz - Inscription</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
             <div class="auth-logo">Eza<span>Biz</span></div>
             <div class="auth-subtitle">Créez votre compte client</div>

             <label class="auth-label" for="nom">Nom complet</label>
             <input class="auth-input" type="text" id="nom" placeholder="Emmanuel Yamba">

             <label class="auth-label" for="email"> Adresse email</label>
             <input class="auth-input" type="email" id="email" placeholder="exemple@gmail.com">

             <label class="auth-label" for="mot_de_passe">Mot de passe</label>
             <input class="auth-input" type="password" id="mot_de_passe" placeholder="........">

             <label class="auth-label" for="sexe">Sexe</label>
             <select class="auth-select" id="sexe">
                 <option value="homme">Homme</option>
                 <option value="femme">Femme</option>
             </select>

             <label class="auth-label" for="date_naissance">Date de naissance</label>
             <input class="auth-input" type="date" id="date_naissance">

             <label class="auth-label" for="activite">Activité</label>
             <select class="auth-select" id="activite">
                  <option value="etudiant">Étudiant</option>
                  <option value="employe">Employé</option>
                  <option value="independant">Indépendant</option>
                  <option value="chomage">Sans emploi</option>
                  <option value="autre">Autre</option>
             </select>

             <label class="auth-label" for="etat_civil">État civil</label>
             <select class="auth-select" id="etat_civil">
                  <option value="celibataire">Célibataire</option>
                  <option value="marie">Marié(e)</option>
                  <option value="divorce">Divorcé(e)</option>
                  <option value="veuf">Veuf / Veuve</option>
             </select>

             <button class="auth-btn" id="btn-inscription">Créer mon compte</button>

             <div class="auth-message" id="message"></div>

             <div class="auth-link">
                Déjà un compte ? <a href="login.html">Se connecter</a>
             </div>
        </div>
    </div>

    <script>
        document.getElementById('btn-inscription').addEventListener('click', function() {
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const mot_de_passe = document.getElementById('mot_de_passe').value;
            const sexe = document.getElementById('sexe').value;
            const date_naissance = document.getElementById('date_naissance').value;
            const activite = document.getElementById('activite').value;
            const etat_civil = document.getElementById('etat_civil').value;
            const message = document.getElementById('message');

            if (!nom || !email || !mot_de_passe || !date_naissance ) {
                message.className = 'auth-message erreur';
                message.textContent = 'Veuillez remplir tous les champs.';
                return;
            }

            if (mot_de_passe.length < 6) {
                message.className = 'auth-message erreur';
                message.textContent = 'Le mot de passe doit faire au moins 6 caractères.';
                return;
            }

            message.className = 'auth-message';
            message.textContent = 'Inscription en cours...';

            fetch('https://ezabiz-production.up.railway.app/api/auth/register' , {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nom, email, mot_de_passe, role: 'client', sexe, date_naissance, activite, etat_civil})
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(resultat) {
                if (resultat.token) {
                    localStorage.setItem('token', resultat.token);
                    message.className = 'auth-message succes';
                    message.textContent = 'Compte créé avec succès !';
                    setTimeout(function() {
                        window.location.href = '../index.html';
                    }, 1000);
                } else {
                    message.className = 'auth-message erreur';
                    message.textContent = resultat.erreur || 'Erreur lors de l\'inscription.';
                }
            })
            .catch(function(erreur) {
                message.className = 'auth-message erreur';
                message.textContent = 'Erreur de connexion. Réessayez.';
                console.error(erreur);
            })
        })
    </script>
</body>
</html>
