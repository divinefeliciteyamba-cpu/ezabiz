<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user=scalable=no">
    <title>EzaBiz</title>
    <!-- Le fichier CSS de feuille   -->
      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- La librairie Font-Awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Le fichier CSS du projet -->
     <link rel="stylesheet" href="assets/css/style.css">
     <!-- Le fichier JavaScript de feuillet   -->
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
      <script src="assets/js/fake-data.js"></script>
      <!-- Lien Leafleat.markercluster-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css"> 
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
     <style>
        *{
            margin: 0;
            padding: 0;
        }
        #carte {
            height: 100vh;
            width: 100%;
            filter: brightness(0.85) contrast(0.9) saturate(0.9);
        }
        body {
            padding: 0;
            margin: 0;
        }
        
        html, body, #carte {
            height: 100%;
            width: 100vw;
        }
     </style>
</head>
<body>
    <div id="filtres">
        <button class="btn-filtre" data-cat="tous">Tous</button>
        <button class="btn-filtre" data-cat="restauration">Restauration</button>
        <button class="btn-filtre" data-cat="pharmacie">Pharmacie</button>
        <button class="btn-filtre" data-cat="epicerie">Épicerie</button>
        <button class="btn-filtre" data-cat="electronique">Électronique</button>
    </div>
    <div id="carte"></div>
    <script>
      const carte = L.map('carte').setView([-11.632240, 27.460640], 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {maxZoom: 19, attribution: '© CartoDB'}).addTo(carte);
      
      //Création des icônes pour les catégories
      
      const ICONES_CAT = {
                'Restauration' : {fa : 'fa-utensils', classe: 'marqueur-restauration'},
                'Pharmacie': {fa : 'fa-pills ', classe: 'marqueur-pharmacie'},
                'Epicerie' :{fa : 'fa-basket-shopping', classe: 'marqueur-epicerie'},
                'Electronique':{fa : 'fa-mobile', classe: 'marqueur-electronique'},
            };
      function getIcone(categorie, nom) {
        const config = ICONES_CAT[categorie] || {fa : 'fa-store', classe: 'marqueur-autre'};
        const html =
            '<div class="marqueur ' + config.classe + '">' +
                '<div class="marqueur-icone">' + 
                    '<i class="fa-solid ' + config.fa + '"></i>' +
                    '</div>' +
                    '<span class="marqueur-nom">' + nom + '</span>' +
                '</div>';
        return L.divIcon({
            className: '',
            html: html,
            iconSize: [160, 32],
            iconAnchor: [16, 16], // ancré sur le rond, pas le texte
            popupAnchor: [80, -16]
        });
      }
       // Actionner le filtrage avec highlight du bouton actif
      document.querySelectorAll('.btn-filtre').forEach(function(bouton) {
         bouton.addEventListener('click', function() {
            document.querySelectorAll('.btn-filtre').forEach(function(b) {
                b.classList.remove('actif');
            });
            bouton.classList.add('actif');
            filtrerMarqueurs(bouton.dataset.cat);
        });
      });

      //Création des marqueurs et Groupe de marqueurs
      let clustersGroup = L.markerClusterGroup();
      let tousLesMarqueurs = [];

      FAKE_PMES.forEach(function(pme){
         const marqueur = L.marker([pme.lat, pme.lng], {icon: getIcone(pme.categorie, pme.nom)})
              .bindPopup(
              '<b>'+ pme.nom+ '</b><br>'+ pme.categorie + 
              '<br><a href="pme/fiche.html?id='+ pme.id +'" class="btn-fiche">Voir la fiche</a>'
              ) // Popup avec le bouton Voir la fiche
              .addTo(carte);
         tousLesMarqueurs.push(marqueur);
         clustersGroup.addLayer(marqueur);
      });

      carte.addLayer(clustersGroup);

      //Filtrage des marqueurs 
      function filtrerMarqueurs(categorie){ 
      // Enlever les marqueurs 
      tousLesMarqueurs.forEach(function(marqueur){
          carte.removeLayer(marqueur);
      });
       //Restituer les marqueurs dans "Tous"
      if(categorie === "tous"){
        tousLesMarqueurs.forEach(function(marqueur){
            marqueur.addTo(carte);
        });
        return;
      };
      // Garder les pmes de la catégorie concernée
      const pmesFiltrees = FAKE_PMES.filter(function(pme){
        return pme.categorie.toLowerCase() === categorie;
      });
      // Remettre les marqueurs filtrés
      pmesFiltrees.forEach(function(pme){
        const marqueur = L.marker([pme.lat, pme.lng], {icon: getIcone(pme.categorie, pme.nom)})
            .bindPopup(
                '<b>'+ pme.nom+ '</b><br>'+ pme.categorie  + 
                '<br><a href="pme/fiche.html?id='+ pme.id +'" class="btn-fiche">Voir la fiche</a>'
            )
            .addTo(carte);
        tousLesMarqueurs.push(marqueur);
        clustersGroup.addLayer(marqueur);
      });

      carte.addLayer(clustersGroup);
      }

      
    </script>
</body>
</html>
