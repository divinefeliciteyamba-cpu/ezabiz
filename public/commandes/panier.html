<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="compteur-panier"></div>
    <div id="panier-container"></div>

    <form id="formulaire-commande" class="formulaire-adresse">
        <h2>Adresse de Livraison</h2>

        <label for="nom-client">Nom complet</label>
        <input type="text" id="nom-client" required>

        <label for="telephone-client">Téléphone</label>
        <input type="tel" id="telephone-client" required>

        <label for="adresse-client">Adresse</label>
        <textarea id="adresse-client" rows="3" required></textarea>

        <button type="submit" class="btn-commander">Passer la commande</button>
    </form>
    <script>
        let panier = JSON.parse(localStorage.getItem('panier')) || [];
        let pmeId = localStorage.getItem('pme_id');

        //Remplissage du panier et addition d'articles
        let htmlPanier = '';
        let total = 0;
        
        //Lecture et Affichage de la liste des articles
        panier.forEach(function(produit){
            htmlPanier += `
            <div class="ligne-panier">
                <span>${produit.nom}</span>
                <span>${produit.prix} FC</span>
            </div>
            `;
            total += produit.prix;
        });

        document.getElementById('panier-container').innerHTML = htmlPanier + `
        <div class="total-panier">
             <strong>Total : ${total} FC</strong>
        </div>
        `;
        function mettreAJouerCompteur(){
            document.getElementById('compteur-panier').innerText = '🛒' + panier.length;
        }
        mettreAJourCompteur();
        
        function passerCommande(){
             //Récuperer le token JWT de l'utilisateur connecté
             const token = localStorage.getItem('token');

             //Vérifier que l'utilisateur est connecté
             if(!token){
                localStorage.setItem('retour_apres_login', window.location.href);
                window.location.href= '../auth/login.html';
                return;
             }

             const nom = document.getElementById('nom-client').value;
             const telephone = document.getElementById('telephone-client').value;
             const adresse = document.getElementById('adresse-client').value;

             //Envoie une demande au serveur
             fetch('https://ezabiz-production.up.railway.app/api/commandes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token                
                },
                body: JSON.stringify({
                    pme_id: pmeId,
                    articles: panier,
                    client_nom: nom,
                    client_telephone: telephone,
                    adresse: adresse
                })
             })
             .then(function(response){
                return response.json();
             })
             .then(function(resultat){
                localStorage.removeItem('panier');
                alert('Commande passée avec succès !');
                window.location.href = '../pme/index.html';
             })
             .catch(function(erreur){
                console.error('Erreur lors de la commande:', erreur);
             });
        }

        //Appel de la fonction quand le formulaire est soumis
        document.getElementById('formulaire-commande').addEventListener('submit', function(e){
            e.preventDefault(); //La page se recharge automatiquement après soumission du formulaire
            passerCommande();
        });
    </script>
</body>
</html>
